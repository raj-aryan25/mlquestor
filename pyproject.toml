[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlquest"
version = "0.1.0"
description = "Budget-aware, evidence-driven autonomous ML competition research agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "MLQuest contributors" }]
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "lightgbm>=4.5,<5",
    "optuna>=4,<5",
    "pandas>=2.2,<3",
    "pandera>=0.20,<1",
    "pydantic>=2.10,<3",
    "pyarrow>=18,<22",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "scikit-learn>=1.5,<2",
    "typer>=0.15,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.115,<7",
    "mypy>=1.13,<2",
    "pandas-stubs>=2.2,<4",
    "pyarrow-stubs>=18,<22",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "scikit-learn-stubs>=0.0.3,<1",
]

[project.scripts]
mlquest = "mlquest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mlquest"]

[[tool.mypy.overrides]]
module = ["threadpoolctl"]
ignore_missing_imports = true
